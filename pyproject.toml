[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lot-sequence-complexity"
version = "0.1.0"
description = "Research software for Language-of-Thought sequence description complexity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "graphviz>=0.20"
]

[project.urls]
Repository = "https://github.com/sfigueir/lot-sequence-complexity"

[tool.setuptools.packages.find]
where = ["."]
include = ["lot*"]
